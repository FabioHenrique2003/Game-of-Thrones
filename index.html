<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Giovanna ❤️</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Cena 1 -->

<section id="scene1" class="scene active">

    <div class="overlay"></div>

    <img
        src="images/trono.jpg"
        class="throne"
        id="throne"
    >

    <h1>Uma decisão precisa ser tomada...</h1>

</section>

<!-- Cena 2 -->

<section id="scene2" class="scene">

    <div class="question-box">

        <h2>
            Giovanna, você aceita ser minha princesa?
        </h2>

        <button id="yes1">
            Sim 👑
        </button>

        <button id="no1">
            Não ❌
        </button>

    </div>

</section>

<!-- Cena 3 -->

<section id="scene3" class="scene">

    <video
        id="dragonVideo"
        autoplay
        playsinline
    >
        <source
            src="videos/dragon-flight.mp4"
            type="video/mp4"
        >
    </video>

    <div class="video-text">
        Nosso reino nos espera...
    </div>

</section>

<!-- Cena 4 -->

<section id="scene4" class="scene hill">

    <div class="question-box">

        <h2>
            Chegamos ao nosso destino
        </h2>

        <h3>
            Sexta feira, às 21 horas, vamos jogar?
        </h3>

        <button id="yes2">
            Sim ❤️
        </button>

        <button id="no2">
            Não ❌
        </button>

    </div>

</section>

<!-- Cena 5 -->

<section id="scene5" class="scene final">

    <div class="final-box">

        <h1>
            ❤️
        </h1>

        <h2>
            Te aguardo ansiosamente nessa noite
        </h2>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
